name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Versión de sherpa-onnx (voz y oído). Si cambia la API, ajustar aquí.
  SHERPA_VERSION: v1.12.33

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Traer sherpa-onnx (librerías nativas y API de Kotlin)
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/sherpa"
          mkdir -p "$WORK"

          # Librerías nativas para Android (arm64)
          curl -fL --retry 3 -o "$WORK/android.tar.bz2" \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}-android.tar.bz2"
          mkdir -p "$WORK/android"
          tar xjf "$WORK/android.tar.bz2" -C "$WORK/android"
          SO_DIR="$(dirname "$(find "$WORK/android" -path '*arm64-v8a/libsherpa-onnx-jni.so' | head -n 1)")"
          test -d "$SO_DIR"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp "$SO_DIR"/*.so app/src/main/jniLibs/arm64-v8a/
          ls -la app/src/main/jniLibs/arm64-v8a

          # Código Kotlin de la API (mismo número de versión)
          git clone --depth 1 --branch "${SHERPA_VERSION}" https://github.com/k2-fsa/sherpa-onnx "$WORK/src"
          KT_DIR="$WORK/src/sherpa-onnx/kotlin-api"
          test -d "$KT_DIR"
          mkdir -p app/src/main/java/com/k2fsa/sherpa/onnx
          cp "$KT_DIR"/*.kt app/src/main/java/com/k2fsa/sherpa/onnx/
          ls app/src/main/java/com/k2fsa/sherpa/onnx

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: waifu-android-ia-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          body: APK de depuración listo para instalar en Android (arm64).
          files: app/build/outputs/apk/debug/app-debug.apk
